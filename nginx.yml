---
# Плейбук: установка и запуск nginx на серверах Ubuntu.
# Запуск: ansible-playbook nginx.yml

- name: Установка nginx на веб-серверы   # Название сценария (выводится при запуске)
  hosts: webservers                       # На каких серверах выполнять — группа из inventory/hosts.ini
  become: true                            # Выполнять задачи через sudo (нужны права root)

  tasks:                                  # Список задач, выполняются по порядку на каждом сервере

    # Задача 1: обновить список пакетов и установить nginx
    - name: Установить nginx
      ansible.builtin.apt:                # Модуль apt — пакетный менеджер Ubuntu/Debian
        name: nginx                       # Имя пакета для установки
        state: present                    # present — установить, если ещё не установлен
        update_cache: true                # Выполнить "apt update" перед установкой
        cache_valid_time: 3600            # Не обновлять кэш, если он обновлялся менее часа назад

    # Задача 2: запустить nginx и добавить его в автозагрузку
    - name: Запустить nginx и включить автозапуск
      ansible.builtin.service:            # Модуль service — управление службами (systemd)
        name: nginx                       # Имя службы
        state: started                    # started — запустить, если не запущена
        enabled: true                     # enabled — запускать автоматически при загрузке сервера

    # Задача 3: убедиться, что nginx действительно отвечает на HTTP-запросы
    - name: Проверить, что nginx отвечает на порту 80
      ansible.builtin.uri:                # Модуль uri — выполняет HTTP-запрос с самого сервера
        url: "http://localhost"           # Адрес для проверки (nginx на этом же сервере)
        status_code: 200                  # Ожидаемый код ответа — 200 OK
      register: nginx_check               # Сохранить результат запроса в переменную nginx_check
      retries: 3                          # Сколько раз повторить при неудаче
      delay: 2                            # Пауза между попытками (в секундах)
      until: nginx_check.status == 200    # Условие успеха — повторять, пока не получим код 200
