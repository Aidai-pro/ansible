# Основной конфигурационный файл Ansible.
# Ansible автоматически подхватывает его, если запускать команды из этой папки.

[defaults]
# Путь к файлу инвентаря (список серверов) — не нужно каждый раз указывать -i
inventory = inventory/hosts.ini

# Не спрашивать подтверждение отпечатка SSH-ключа при первом подключении к серверу
host_key_checking = False

# Не создавать файлы *.retry после неудачного запуска плейбука
retry_files_enabled = False

# Автоматически находить Python на сервере и не выводить предупреждения об этом
interpreter_python = auto_silent

[privilege_escalation]
# Выполнять задачи с повышенными правами (root)
become = True

# Способ получения прав root — через sudo
become_method = sudo
